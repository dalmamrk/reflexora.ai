<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflex-Policy Architecture — Hero Diagram V2</title>
    <style>
        /* ============================================================
     PREVIEW HARNESS — solo per valutazione, NON va integrato.
     ============================================================ */
        :root {
            --bg-dark: #070a13;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            font-family: var(--font-mono);
            min-height: 100vh;
            padding: 2rem 1.25rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
        }

        .harness-note {
            max-width: 700px;
            font-size: 0.72rem;
            line-height: 1.75;
            color: var(--text-secondary);
            letter-spacing: 0.03em;
            text-align: center;
        }

        .harness-note b {
            color: #00f2fe;
            font-weight: 500;
        }

        .frame-label {
            font-size: 0.6rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 0.6rem;
            display: block;
            text-align: center;
        }

        .frame {
            border: 1px dashed rgba(255, 255, 255, 0.12);
            border-radius: 12px;
        }

        .frame--desktop {
            width: 568px;
            height: 500px;
            max-width: 100%;
        }

        .frame--mobile {
            width: 335px;
            height: 300px;
            max-width: 100%;
        }

        /* ============================================================
     COMPONENTE — CSS totalmente autosufficiente e scoped.
     ============================================================ */
        .rp-diagram {
            /* Variabili locali per autosufficienza */
            --rp-font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
            --rp-hairline: rgba(255, 255, 255, 0.10);

            /* Palette semantica */
            --rp-policy: #8b5cf6;
            --rp-reflex: #00f2fe;
            --rp-power: #ff5a45;
            --rp-sense: #2ee6a8;
            --rp-bus: #ffb224;
            --rp-ink: #f8fafc;
            --rp-muted: #a8b6cc;
            /* Contrasto aumentato per WCAG AA */
            --rp-line: rgba(255, 255, 255, 0.13);

            width: 100%;
            height: 100%;
            display: block;
            font-family: var(--rp-font-mono);
        }

        .rp-diagram svg,
        .rp-diagram symbol {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ---------- Nodi ---------- */
        .rp-node rect.rp-card {
            rx: 9;
            stroke-width: 1.25;
        }

        .rp-node .rp-title {
            fill: var(--rp-ink);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-anchor: middle;
        }

        .rp-node .rp-sub {
            fill: var(--rp-muted);
            font-size: 10.5px;
            font-weight: 400;
            letter-spacing: 0.015em;
            text-anchor: middle;
        }

        .rp-node .rp-crest {
            stroke-width: 1.25;
            opacity: .85;
        }

        .rp-node--policy rect.rp-card {
            fill: url(#rpGradPolicy);
            stroke: rgba(139, 92, 246, .55);
        }

        .rp-node--policy .rp-crest {
            stroke: var(--rp-policy);
        }

        .rp-node--reflex rect.rp-card {
            fill: url(#rpGradReflex);
            stroke: rgba(0, 242, 254, .6);
        }

        .rp-node--reflex .rp-crest {
            stroke: var(--rp-reflex);
        }

        .rp-node--power rect.rp-card {
            fill: url(#rpGradPower);
            stroke: rgba(255, 90, 69, .5);
        }

        .rp-node--power .rp-crest {
            stroke: var(--rp-power);
        }

        .rp-node--phys rect.rp-card {
            fill: url(#rpGradSense);
            stroke: rgba(46, 230, 168, .45);
            rx: 16;
        }

        .rp-node--phys .rp-crest {
            stroke: var(--rp-sense);
        }

        .rp-node--reflex {
            filter: drop-shadow(0 0 10px rgba(0, 242, 254, .28));
        }

        .rp-node--reflex rect.rp-card {
            animation: rpBreathe 4.5s ease-in-out infinite;
        }

        @keyframes rpBreathe {

            0%,
            100% {
                stroke: rgba(0, 242, 254, .45);
            }

            50% {
                stroke: rgba(0, 242, 254, .95);
            }
        }

        .rp-node--power {
            filter: drop-shadow(0 0 8px rgba(255, 90, 69, .16));
        }

        /* ---------- Zone e Parentesi ---------- */
        .rp-zone {
            fill: rgba(0, 242, 254, 0.018);
            stroke: rgba(255, 255, 255, .085);
            stroke-width: 1;
            stroke-dasharray: 3 7;
            rx: 14;
        }

        .rp-bracket {
            fill: none;
            stroke-width: 1.6;
            stroke-linecap: round;
            animation: rpBracket 5s ease-in-out infinite alternate;
        }

        @keyframes rpBracket {
            0% {
                stroke: rgba(0, 242, 254, .25);
            }

            100% {
                stroke: rgba(0, 242, 254, .75);
            }
        }

        .rp-zone-label {
            fill: var(--rp-reflex);
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-anchor: middle;
            opacity: .8;
        }

        /* ---------- Tracce e flussi ---------- */
        .rp-trace {
            fill: none;
            stroke: var(--rp-line);
            stroke-width: 1.25;
        }

        .rp-trace--bus {
            stroke: rgba(255, 255, 255, .16);
            stroke-width: 3.5;
            stroke-linecap: round;
        }

        .rp-flow {
            fill: none;
            stroke-linecap: round;
            animation: rpFlow linear infinite;
            /* Consolidamento del drop-shadow via variabili */
            filter: drop-shadow(0 0 var(--glow-rad, 4px) var(--glow-col, transparent));
        }

        @keyframes rpFlow {
            to {
                stroke-dashoffset: -40;
            }
        }

        .rp-flow--policy {
            stroke: var(--rp-policy);
            stroke-width: 1.6;
            stroke-dasharray: 7 17;
            animation-duration: 2s;
            --glow-col: rgba(139, 92, 246, .5);
            --glow-rad: 4px;
        }

        .rp-flow--reflex {
            stroke: var(--rp-reflex);
            stroke-width: 1.8;
            stroke-dasharray: 11 13;
            animation-duration: 1s;
            /* Rallentato da .5s a 1s */
            --glow-col: rgba(0, 242, 254, .65);
            --glow-rad: 5px;
        }

        .rp-flow--sense {
            stroke: var(--rp-sense);
            stroke-width: 1.6;
            stroke-dasharray: 5 13;
            animation-duration: .6s;
            --glow-col: rgba(46, 230, 168, .5);
            --glow-rad: 4px;
        }

        .rp-flow--power {
            stroke: var(--rp-power);
            stroke-width: 3;
            stroke-dasharray: 14 16;
            animation-duration: .8s;
            --glow-col: rgba(255, 90, 69, .55);
            --glow-rad: 6px;
        }

        .rp-flow--bus {
            stroke: var(--rp-bus);
            stroke-width: 3.5;
            stroke-dasharray: 18 22;
            animation-duration: 1s;
            --glow-col: rgba(255, 178, 36, .55);
            --glow-rad: 7px;
        }

        /* ---------- Etichette ---------- */
        .rp-chip {
            fill: #080c15;
            stroke: var(--rp-hairline);
            stroke-width: 1;
            rx: 5;
        }

        .rp-chip-text {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-anchor: middle;
            fill: var(--rp-muted);
        }

        .rp-tag {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .rp-tag--end {
            text-anchor: end;
        }

        .rp-tag--start {
            text-anchor: start;
        }

        .rp-tag--sense {
            fill: var(--rp-sense);
        }

        .rp-tag--reflex {
            fill: var(--rp-reflex);
        }

        .rp-tag--power {
            fill: var(--rp-power);
        }

        /* ---------- Accessibilità: reduced-motion ---------- */
        @media (prefers-reduced-motion: reduce) {

            .rp-flow,
            .rp-bracket,
            .rp-node--reflex rect.rp-card {
                animation: none !important;
            }

            .rp-flow {
                stroke-dasharray: none;
                opacity: .45;
            }

            .rp-bracket {
                stroke: rgba(0, 242, 254, .5);
            }
        }

        /* ---------- Performance: pausa off-screen ---------- */
        .rp-diagram.is-paused .rp-flow,
        .rp-diagram.is-paused .rp-bracket,
        .rp-diagram.is-paused .rp-node--reflex rect.rp-card {
            animation-play-state: paused;
        }
    </style>
</head>

<body>

    <p class="harness-note">
        <b>Anteprima V2</b> — Architettura robusta basata su <b>&lt;symbol&gt;</b> + <b>&lt;use&gt;</b>.
        Accessibilità <b>aria-labelledby</b> + <b>title/desc</b>.

                    <path class="rp-bracket" d="M 651 130 L 671 130 Q 685 130 685 144 L 685 164" />

                    <text class="rp-zone-label" x="560" y="156">BATTERY-SIDE LOCAL REFLEX ZONE</text>

                    <path class="rp-trace" marker-end="url(#rpArrow)" d="M 150 560 L 150 233" />
                    <path class="rp-trace" marker-end="url(#rpArrow)" d="M 290 233 L 290 345" />
                    <path class="rp-trace" marker-end="url(#rpArrow)" d="M 630 560 L 630 233" />
                    <path class="rp-trace" marker-end="url(#rpArrow)" d="M 490 233 L 490 345" />

                    <path class="rp-trace" marker-end="url(#rpArrow)" d="M 330 84 L 330 112 L 220 112 L 220 175" />
                    <path class="rp-trace" marker-end="url(#rpArrow)" d="M 450 84 L 450 112 L 560 112 L 560 175" />

                    <!-- flussi animati (sovrapposti alle tracce) -->
                    <path class="rp-flow rp-flow--power" d="M 220 560 L 220 403" />
                    <path class="rp-flow rp-flow--bus" d="M 320 374 L 460 374" />

                    <text class="rp-chip-text" x="275" y="116">Permission Envelope</text>
                    <rect class="rp-chip" x="439" y="101" width="132" height="22" />
                    <text class="rp-chip-text" x="505" y="116">Permission Envelope</text>

                    <text class="rp-tag rp-tag--end rp-tag--sense" x="142" y="296">(V, T, Shade)</text>
                    <text class="rp-tag rp-tag--start rp-tag--reflex" x="298" y="281">Bypass /</text>

            <!-- 2. Istanza Desktop Accessibile -->

    <div>

                    <use href="#rp-diagram-symbol"></use>
                </svg>
            </div>
        </div>
    </div>

    <script>
        // Logica per pausa animazioni off-screen (risparmio batteria e CPU)
        (function () {
            var diagrams = document.querySelectorAll('.rp-diagram');
            if (!diagrams.length || !('IntersectionObserver' in window)) return;

            var observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    // Aggiunge la classe is-paused al container quando non è visibile
                    entry.target.classList.toggle('is-paused', !entry.isIntersecting);
                });
            }, { threshold: 0.05 }); // Innesca quando almeno il 5% è fuori dallo schermo

            diagrams.forEach(function (d) { observer.observe(d); });
        })();
    </script>
